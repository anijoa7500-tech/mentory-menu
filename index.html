                  <div className="absolute inset-0 opacity-30 bg-[linear-gradient(90deg,rgba(255,255,255,.5)_1px,transparent_1px),linear-gradient(rgba(255,255,255,.5)_1px,transparent_1px)] bg-[length:42px_42px] rotate-6 scale-125" />
                  <div className="relative z-10">
                    <div className="text-7xl mb-4">🐢</div>
                    <h3 className="text-5xl font-black drop-shadow-[4px_4px_0px_#000]">
                      GEOBUGI HOTEL
                    </h3>
                    <p className="mt-4 bg-black text-yellow-300 inline-block px-5 py-2 font-black">
                      Mentory 제휴 할인 제공
                    </p>
                  </div>
                </div>

                <div className="mt-7 bg-[#1c1c1c] border-[3px] border-[#333] p-6 leading-8 font-bold text-gray-300">
                  <h3 className="text-yellow-300 text-2xl font-black mb-3">협찬 내용</h3>
                  <p>
                    거북이 호텔은 Mentory 프로젝트와 연계하여 관광객 대상 숙박 할인 혜택을
                    지원합니다. 발표에서는 이 협찬을 통해 관광 코스, 숙박, 지역 상권을 함께
                    연결하는 구조를 보여줄 수 있습니다.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
                  <a
                    href="http://www.geobugi.co.kr/"
                    target="_blank"
                    rel="noreferrer"
                    className="h-14 border-[3px] border-yellow-600 bg-yellow-400 text-black text-xl font-black flex items-center justify-center hover:brightness-110 transition"
                  >
                    호텔 홈페이지 보기 〉
                  </a>

                  <button
                    onClick={() => setPage("contents")}
                    className="h-14 border-[3px] border-green-500 text-green-400 text-xl font-black hover:bg-green-500 hover:text-black transition"
                  >
                    목차로 돌아가기
                  </button>
                </div>
              </section>
            </div>
          </main>
        </section>
      );
    }

    function SimplePage({ title, setPage }) {
      return (
        <section className="min-h-screen bg-[#111] flex items-center justify-center px-5 text-center text-white">
          <div className="bg-[#24211f] border-4 border-[#3c3c3c] p-10 max-w-xl">
            <h1 className="text-5xl font-black text-yellow-300 mb-6">{title}</h1>
            <p className="text-gray-300 font-bold leading-8 mb-8">
              아직 상세 화면은 제작 전입니다. 메뉴 이동 테스트용 화면입니다.
            </p>
            <button
              onClick={() => setPage("contents")}
              className="px-7 py-4 border-[3px] border-green-500 text-green-400 font-black"
            >
              목차로 돌아가기
            </button>
          </div>
        </section>
      );
    }

    function MentoryPreview() {
      const [page, setPage] = useState("main");

      return (
        <div className="min-h-screen bg-[#101010] text-white font-sans">
          <Header page={page} setPage={setPage} />

          {page === "main" && <MainPage setPage={setPage} />}
          {page === "contents" && <ContentsPage setPage={setPage} />}
          {page === "item" && <ItemPage setPage={setPage} />}
          {page === "tour" && <TourPage setPage={setPage} />}
          {page === "support" && <SupportPage setPage={setPage} />}
          {page === "effect" && <SimplePage title="기대효과" setPage={setPage} />}
        </div>
      );
    }

    // React 18 전용 렌더링 방식 적용
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MentoryPreview />);
  </script>
</body>
</html>
